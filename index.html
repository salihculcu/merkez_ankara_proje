<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Merkez Ankara — İç Mekan Navigasyon</title>
  <link rel="stylesheet" href="./styles/main.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./lib/three.module.js",
        "three/addons/": "./lib/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 3B sahne -->
  <div id="app"></div>

  <!-- Üst bar -->
  <header id="topbar">
    <div class="brand">
      <div class="brand-mark">MA</div>
      <div class="brand-text">
        <h1>MERKEZ ANKARA</h1>
        <span id="floor-label">Kat 1 — Etkileşimli Yönlendirme</span>
      </div>
    </div>
    <div class="topbar-right">
      <div id="clock" aria-hidden="true"></div>
      <button id="a11y-toggle" class="pill-btn" type="button" aria-pressed="false" title="Engelsiz rota: merdiven ve yürüyen merdiven kullanılmaz">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="4" r="2"></circle>
          <path d="M11 7v6h5l3 6"></path>
          <path d="M11 11h4"></path>
          <path d="M15.5 12.5a6 6 0 1 1-8-4.5"></path>
        </svg>
        <span>Engelsiz Rota</span>
      </button>
    </div>
  </header>

  <!-- Sol panel: arama + mağaza listesi -->
  <aside id="store-panel">
    <div class="panel-head">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="store-search" type="search" placeholder="Mağaza ara..." autocomplete="off" />
      </div>
      <div id="category-chips" class="chips"></div>
    </div>
    <ul id="store-list" class="store-list"></ul>
  </aside>

  <!-- Bilgi kartı -->
  <section id="info-card" class="hidden" aria-live="polite">
    <div class="card-accent"></div>
    <div class="card-body">
      <div class="card-title-row">
        <div>
          <h2 id="card-name">—</h2>
          <div class="card-meta">
            <span id="card-category" class="badge"></span>
            <span id="card-floor" class="badge badge-dim"></span>
          </div>
        </div>
        <button id="card-close" class="icon-btn" type="button" aria-label="Kapat">✕</button>
      </div>
      <div id="card-route-info" class="route-info">
        <span id="card-distance">—</span>
        <span class="dot">·</span>
        <span id="card-eta">—</span>
        <span id="card-a11y-note" class="a11y-note hidden">Engelsiz rota</span>
      </div>
      <button id="card-clear-route" class="pill-btn danger" type="button">Rotayı Temizle</button>
    </div>
  </section>

  <!-- Sol alt: konum göstergesi -->
  <div id="legend">
    <span class="legend-dot"></span>
    <span>Buradasınız</span>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>

  <!-- Yükleme ekranı -->
  <div id="loading-overlay">
    <div class="loading-box">
      <div class="loading-title">MERKEZ ANKARA</div>
      <div class="loading-sub">3B model yükleniyor…</div>
      <div class="progress-track"><div id="progress-fill"></div></div>
      <div id="progress-text">%0</div>
    </div>
  </div>

  <!-- Hata katmanı (geliştirme) -->
  <div id="error-overlay" class="hidden"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
